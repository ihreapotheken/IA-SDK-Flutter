name: appsdk_v2_flutter_plugin_example
description: "Demonstrates how to use the appsdk_v2_flutter_plugin plugin."
publish_to: 'none'

environment:
  sdk: '>=3.10.0'
  flutter: '>=3.30.0'

dependencies:
  flutter:
    sdk: flutter
  ia_example_demo:
    path: packages/demo
  ia_example_shared:
    path: packages/shared
  ia_example_single_entry_point:
    path: packages/single_entry_point

dev_dependencies:
  flutter_lints: ^6.0.0
  
workspace:
  - packages/demo
  - packages/shared
  - packages/single_entry_point

flutter:
  uses-material-design: true
  assets:
    - .secrets
    - .env