name: Native SDK from branch

# Build the native IA SDKs (Android + iOS) from a chosen branch and verify the
# Flutter example app links against those local builds. Defaults to the latest
# `develop` of each native SDK; any branch can be given instead.
#
# Android: the SDK modules are published to the runner's mavenLocal at version
#   YYYY.MM.DD.MIN and the wrapper's ANDROID_APPSDK_VERSION is pinned to it (the
#   gradle files consult mavenLocal() before GitHub Packages, so the local build
#   wins). iOS: the plugin's SwiftPM manifests are pointed at the IA-SDK-dev-ios
#   checkout, so the branch's Swift sources are compiled into the app.
#
# Runs on the self-hosted macOS runner. Required repo secrets (set once via
# scripts/ci/provision-secrets.sh): PAT, STRAPI_DEV_TOKEN, STRAPI_STAGING_TOKEN,
# STRAPI_PROD_TOKEN, CARDLINK_CUSTOMER_KEY_{DEBUG,DEV,RELEASE},
# CARDLINK_REPORT_KEY_{DEBUG,DEV,RELEASE}, IASDK_FILE_SERVICE_KEY,
# IASDK_LOGGER_ENCRYPTION_KEY, IASDK_SSL_PINNING_DEACTIVATION_KEY,
# IASDK_REMOTE_CONFIGURATION_SECRET_KEY, NETRC_USER, NETRC_TOKEN, APPSDK_ACCESS_KEY.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which native SDK(s) to build'
        type: choice
        default: 'all'
        options: [all, android, ios]
      android_branch:
        description: 'IA-SDK-Dev-Android branch'
        type: string
        default: 'develop'
      ios_branch:
        description: 'IA-SDK-dev-ios branch'
        type: string
        default: 'develop'
      build_example:
        description: 'Also build the example app to verify linkage'
        type: boolean
        default: true

permissions:
  contents: read

env:
  PLATFORM: ${{ github.event.inputs.platform || 'all' }}
  ANDROID_BRANCH: ${{ github.event.inputs.android_branch || 'develop' }}
  IOS_BRANCH: ${{ github.event.inputs.ios_branch || 'develop' }}
  JAVA_HOME: /opt/homebrew/opt/openjdk@17
  ANDROID_HOME: /Users/nativeteam/Library/Android/sdk
  ANDROID_SDK_ROOT: /Users/nativeteam/Library/Android/sdk
  # Native SDK checkouts live beside the wrapper checkout, shared across runs.
  DEV_ANDROID_DIR: ${{ github.workspace }}/../IA-SDK-Dev-Android
  DEV_IOS_DIR: ${{ github.workspace }}/../IA-SDK-dev-ios

jobs:
  native-from-branch:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v4

      - name: Set up PATH
        run: |
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Compute native version
        id: ver
        run: echo "version=$(bash scripts/ci/native-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Clone / update native SDK checkouts
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          clone_or_update() { # url dir branch
            local url="$1" dir="$2" branch="$3"
            if [ -d "$dir/.git" ]; then git -C "$dir" fetch --all --quiet
            else git clone "https://x-access-token:${PAT}@github.com/${url}.git" "$dir"; fi
            git -C "$dir" checkout --force "$branch"
            git -C "$dir" reset --hard "origin/$branch"
            echo "$url @ $(git -C "$dir" rev-parse --short HEAD) ($branch)"
          }
          if [ "$PLATFORM" = all ] || [ "$PLATFORM" = android ]; then
            clone_or_update ihreapotheken/IA-SDK-Dev-Android "$DEV_ANDROID_DIR" "$ANDROID_BRANCH"
          fi
          if [ "$PLATFORM" = all ] || [ "$PLATFORM" = ios ]; then
            clone_or_update ihreapotheken/IA-SDK-dev-ios "$DEV_IOS_DIR" "$IOS_BRANCH"
          fi

      - name: Build native SDK(s) and wire into wrapper
        env:
          NATIVE_VERSION: ${{ steps.ver.outputs.version }}
          # Android dependency resolution (GitHub Packages) + build-time SDK secrets
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PAT }}
          STRAPI_DEV_TOKEN: ${{ secrets.STRAPI_DEV_TOKEN }}
          STRAPI_STAGING_TOKEN: ${{ secrets.STRAPI_STAGING_TOKEN }}
          STRAPI_PROD_TOKEN: ${{ secrets.STRAPI_PROD_TOKEN }}
          CARDLINK_CUSTOMER_KEY_DEBUG: ${{ secrets.CARDLINK_CUSTOMER_KEY_DEBUG }}
          CARDLINK_CUSTOMER_KEY_DEV: ${{ secrets.CARDLINK_CUSTOMER_KEY_DEV }}
          CARDLINK_CUSTOMER_KEY_RELEASE: ${{ secrets.CARDLINK_CUSTOMER_KEY_RELEASE }}
          CARDLINK_REPORT_KEY_DEBUG: ${{ secrets.CARDLINK_REPORT_KEY_DEBUG }}
          CARDLINK_REPORT_KEY_DEV: ${{ secrets.CARDLINK_REPORT_KEY_DEV }}
          CARDLINK_REPORT_KEY_RELEASE: ${{ secrets.CARDLINK_REPORT_KEY_RELEASE }}
          # iOS build-time SDK secrets + SwiftPM auth for the private CardLink package
          IASDK_FILE_SERVICE_KEY: ${{ secrets.IASDK_FILE_SERVICE_KEY }}
          IASDK_LOGGER_ENCRYPTION_KEY: ${{ secrets.IASDK_LOGGER_ENCRYPTION_KEY }}
          IASDK_SSL_PINNING_DEACTIVATION_KEY: ${{ secrets.IASDK_SSL_PINNING_DEACTIVATION_KEY }}
          IASDK_REMOTE_CONFIGURATION_SECRET_KEY: ${{ secrets.IASDK_REMOTE_CONFIGURATION_SECRET_KEY }}
          NETRC_USER: ${{ secrets.NETRC_USER }}
          NETRC_TOKEN: ${{ secrets.NETRC_TOKEN }}
        run: bash scripts/ci/build-native.sh

      - name: Build example app (verify linkage)
        if: ${{ github.event.inputs.build_example != 'false' }}
        env:
          APPSDK_ACCESS_KEY: ${{ secrets.APPSDK_ACCESS_KEY }}
        run: |
          set -euo pipefail
          echo "APPSDK_ACCESS_KEY=${APPSDK_ACCESS_KEY}" > example/.secrets
          ( cd example && flutter pub get )
          if [ "$PLATFORM" = all ] || [ "$PLATFORM" = android ]; then
            ( cd example && flutter build apk --debug --flavor demo )
          fi
          if [ "$PLATFORM" = all ] || [ "$PLATFORM" = ios ]; then
            flutter config --enable-swift-package-manager
            ( cd example && flutter build ios --simulator --debug --flavor demo )
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Native SDK from branch"
            echo "- Version: \`${{ steps.ver.outputs.version }}\`"
            echo "- Platform: \`$PLATFORM\`"
            echo "- Android branch: \`$ANDROID_BRANCH\`"
            echo "- iOS branch: \`$IOS_BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore wrapper working tree
        if: always()
        run: |
          # Undo the local-SPM patch and version pins so the reused checkout is clean.
          python3 .claude/skills/connect-local-spm/scripts/ia_local_spm.py restore || true
          git checkout -- .env 2>/dev/null || true
          rm -f example/.secrets
