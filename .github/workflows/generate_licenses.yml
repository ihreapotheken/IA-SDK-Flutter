name: Generate Licenses

on:
  push:
    tags:
      - '*'

jobs:
  generate-licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/IASDK-2173/cardlink

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Generate licenses.html
        run: dart run licenses/generate_licenses.dart

      - name: Commit and push licenses.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f licenses/licenses.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update licenses.html for ${GITHUB_REF_NAME}"
          git push origin HEAD:feature/IASDK-2173/cardlink
