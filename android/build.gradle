group = "com.example.appsdk_v2_flutter_plugin"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven {
            url = uri("https://api.mapbox.com/downloads/v2/releases/maven")
        }
        mavenLocal()
        maven {
            url = uri("https://nexus.link4.health/repository/link4health-anonymous/")
        }
        maven {
            name = "IA SDK repo"
            url = uri("https://maven.pkg.github.com/ihreapotheken/IA-SDK-Android")
            credentials {
                username = System.getenv("GITHUB_USERNAME") ?: "appsdk-service@4ofthem.eu"
                password = System.getenv("GITHUB_TOKEN") ?: "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"
            }
        }
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.12.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.20"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    namespace = "de.ihreapotheken.appsdk_v2_flutter_plugin"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 30
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    def envFile = file(buildFile.parentFile.path + "/../.env")
    def env = [:]
    if (envFile.exists()) {
        envFile.eachLine { line ->
            line = line.trim()
            if (!line || line.startsWith("#")) return
            def parts = line.split("=", 2)
            env[parts[0]] = parts.length > 1 ? parts[1] : ""
        }
    }
    def iaDeSdkVersion = env["ANDROID_APPSDK_VERSION"]
    if (iaDeSdkVersion == null) {
        throw new GradleException("No ANDROID_APPSDK_VERSION provided from .env file.")
    }
    iaDeSdkVersion = iaDeSdkVersion.replaceAll("\"", "")
    def iaDeSdkDeps = [
            "integrations",
            "otc",
            "ordering",
            "pharmacy",
            "rx",
            "apofinder",
            "appointments",
            "cardlink",
    ]
    iaDeSdkDeps.each { dep ->
        def fullDep = "a${dep}:${iaDeSdkVersion}"
        implementation fullDep
    }
    implementation("androidx.compose.material3:material3:1.3.1")
    implementation("androidx.compose.foundation:foundation-layout:1.7.6")
}