group = "com.example.ia_over_the_counter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven {
            url = uri("https://api.mapbox.com/downloads/v2/releases/maven")
        }
        mavenLocal()
        maven {
            url = uri("https://nexus.link4.health/repository/link4health-anonymous/")
        }
        maven {
            name = "IA SDK repo"
            url = uri("https://maven.pkg.github.com/ihreapotheken/IA-SDK-Android")
            credentials {
                username = System.getenv("GITHUB_USERNAME") ?: "appsdk-service@4ofthem.eu"
                password = System.getenv("GITHUB_TOKEN") ?: ("github_pat_" +
                        new String(Base64.getDecoder().decode(
                                "ZFg4OHliZ0tONlQyTkZCWVhQb1NvbndhcEJXVUxMTllXTkdHYmtGNVNEMDltdThMMlBEdUhKTDVmWWNfQ2tYQ3gwa0sydGNUMElEWUlWMkIxMQ==",
                        )).reverse())
            }
        }
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.12.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
        classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    namespace = "de.ihreapotheken.appsdk.flutter.over_the_counter"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 30
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
        def envFile = file(buildFile.parentFile.path + "/../../../.env")
        def env = [:]
        if (envFile.exists()) {
            envFile.eachLine { line ->
                line = line.trim()
                if (!line || line.startsWith("#")) return
                def parts = line.split("=", 2)
                env[parts[0]] = parts.length > 1 ? parts[1] : ""
            }
        }
        def iaDeSdkVersion = env["ANDROID_APPSDK_VERSION"]
        if (iaDeSdkVersion == null) {
            throw new GradleException("No ANDROID_APPSDK_VERSION provided from .env file.")
        }
        iaDeSdkVersion = iaDeSdkVersion.replaceAll("\"", "")
        implementation("de.ihreapotheken.sdk:integrations:${iaDeSdkVersion}")
        implementation("de.ihreapotheken.sdk:otc:${iaDeSdkVersion}")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
