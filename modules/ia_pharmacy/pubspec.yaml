name: ia_pharmacy
description: "AppSDK Pharmacy Services."
version: 0.0.1
homepage: https://ihreapotheken.de/
publish_to: none

environment:
  sdk: ">=3.10.0"
  flutter: ">=3.30.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ia_interface:
    path: ../../interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: de.ihreapotheken.appsdk.flutter.pharmacy
        pluginClass: IaSdkFlutterPharmacy
      ios:
        pluginClass: IaSdkFlutterPharmacy